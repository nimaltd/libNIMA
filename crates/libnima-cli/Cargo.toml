[package]
name = "libnima-cli"
description = "The libnima command: install an embedded C library into the project you are in"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

# Not the name of the package, because the window's program sits beside this one
# and Windows sees libnima.exe and libNIMA.exe as the same file.
[[bin]]
name = "libnima"
path = "src/main.rs"

[dependencies]
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libnima-core = { path = "../libnima-core" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
