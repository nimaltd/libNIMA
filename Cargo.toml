[workspace]
members = ["crates/libnima-core", "crates/libnima-cli", "src-tauri"]
resolver = "3"

[workspace.package]
version = "1.3.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["Nima Askari (NimaLTD) <nima.askari@gmail.com>"]
repository = "https://github.com/nimaltd/libNIMA"
homepage = "https://github.com/nimaltd/libNIMA"

[profile.release]
codegen-units = 1
lto = true
strip = true
